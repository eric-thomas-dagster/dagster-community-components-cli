[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "dagster-community-components-cli"
version = "0.8.2"
description = "CLI to search, install, and manage Dagster community components."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Eric Thomas", email = "eric.thomas@dagsterlabs.com" },
]
keywords = ["dagster", "components", "cli", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pinned to a specific major line — ruff periodically expands the DEFAULT
    # rule set on new minor versions, which silently breaks CI. We opt into
    # which rules run via [tool.ruff.lint].select below.
    "ruff>=0.13,<0.16",
    "build>=1.0",
]

[project.scripts]
dagster-component = "dagster_component_cli.cli:main"
dagster-analyze-schedules = "dagster_component_cli.automation_analyzer:main"

[project.urls]
Homepage = "https://dagster-component-ui.vercel.app/"
Registry = "https://github.com/eric-thomas-dagster/dagster-component-templates"
Repository = "https://github.com/eric-thomas-dagster/dagster-community-components-cli"
Issues = "https://github.com/eric-thomas-dagster/dagster-community-components-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_component_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit rule selection — matches the community-integrations standards
# plus the classic pyflakes/pycodestyle defaults. Add rules deliberately
# rather than inheriting ruff's default set (which expands on new minor
# versions).
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort (import ordering)
    "UP",    # pyupgrade (Optional → | None, etc.)
]
ignore = [
    "E501",  # line too long — line-length is set above; skip the per-line noise
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
