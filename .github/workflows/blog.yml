name: blog

# Auto-regen blog/feed.xml + blog/README.md Posts table whenever a post
# is added or changed. Author's job = write blog/<slug>.md with frontmatter
# and push. This workflow does the rest.

on:
  push:
    branches: [main]
    paths:
      - "blog/**.md"
      - "tools/generate_rss.py"
      - ".github/workflows/blog.yml"

# One writer at a time — cancels an older run if a newer push arrives.
concurrency:
  group: blog-regen
  cancel-in-progress: false

permissions:
  contents: write  # required for the workflow to commit back to main

jobs:
  regen:
    runs-on: ubuntu-latest
    # Loop guard: skip if this push was authored by the workflow itself.
    if: github.event.head_commit.author.email != 'actions@github.com'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can push a follow-up commit if needed.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate feed.xml + README Posts table
        run: python tools/generate_rss.py

      - name: Commit + push if changed
        run: |
          if git diff --quiet blog/feed.xml blog/README.md; then
            echo "no changes — feed + README already in sync"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"
          git add blog/feed.xml blog/README.md
          # `[skip ci]` avoids retriggering the workflow on the auto-commit.
          git commit -m "chore(blog): regenerate feed.xml + README Posts table [skip ci]"
          git push
