[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic_tour"
version = "0.1.0"
description = "4 agentic pipelines as ONE Dagster+ Serverless code location — deploy with a single command"
requires-python = ">=3.10"

# Direct GitHub archive URL for dagster-community-components so we always
# pull the latest components + the current AgenticPipelineComponent
# metadata surface. Swap for a PyPI pin (`dagster-community-components>=0.10.65`)
# once you want stable versioning.
dependencies = [
    "dagster>=1.10.0",
    "dagster-cloud",
    "dagster-community-components @ https://github.com/eric-thomas-dagster/dagster-component-templates/archive/main.zip",
    "litellm>=1.30.0",
    "requests",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_tour"]

[tool.dagster]
module_name = "agentic_tour.definitions"
code_location_name = "agentic_tour"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "agentic_tour"
