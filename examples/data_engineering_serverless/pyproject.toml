[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data_engineering"
version = "0.1.0"
description = "Real data pipeline as one Dagster+ Serverless code location — no API keys, no LLMs"
requires-python = ">=3.10"

dependencies = [
    "dagster>=1.10.0",
    "dagster-cloud",
    "pandas",
    "requests",
    "duckdb",
    "tabulate",   # for .to_markdown() rendering in materialization metadata
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/data_engineering"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "data_engineering"
