[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid_git_runner"
version = "0.1.0"
description = "Deploy once to Dagster+ Hybrid; iterate by pushing flows to a git repo"
requires-python = ">=3.10"

# Pull script_orchestrator directly from the maintainer's repo. Bakes it
# into the runner image at build time; end users don't install anything.
dependencies = [
    "dagster>=1.10.0",
    "dagster-cloud",
    "script-orchestrator @ git+https://github.com/eric-thomas-dagster/script_scheduling_and_orchestration.git@61d736f#subdirectory=script_orchestrator",
    "gitpython",
    "pydantic",
    "python-dotenv",

    # Batteries-included: common data-eng packages so most flows work
    # without rebuilding the runner image. For anything not here, users
    # override --registry and rebuild, or ship `requirements.txt` in
    # their flows repo (auto-installed at code-location load if present).
    #
    # NOTE: script-orchestrator transitively pulls in pandas, pyarrow,
    # sqlalchemy, requests, prefect, airflow, dask/distributed, redis,
    # tabulate, beautifulsoup4 — so those don't need to be listed here.
    "duckdb",
    "boto3",
    "s3fs",
    "gcsfs",
    "adlfs",
    "psycopg2-binary",
    "pymysql",
    "openpyxl",
    "httpx",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_git_runner"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "hybrid_git_runner"
