[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid_git_runner"
version = "0.1.0"
description = "Deploy once to Dagster+ Hybrid; iterate by pushing flows to a git repo"
requires-python = ">=3.10"

# Pull script_orchestrator directly from the maintainer's repo. Bakes it
# into the runner image at build time; end users don't install anything.
dependencies = [
    "dagster>=1.10.0",
    "dagster-cloud",
    "script-orchestrator @ git+https://github.com/eric-thomas-dagster/script_scheduling_and_orchestration.git#subdirectory=script_orchestrator",
    "gitpython",
    "pydantic",
    "python-dotenv",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_git_runner"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "hybrid_git_runner"
