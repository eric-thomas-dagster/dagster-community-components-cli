type: rmj_sample.components.RmjSqlAssetComponent
attributes:
  asset_key: "nightly_sales_load__sales_fact"
  connection_env: "RMJ_CONN_WAREHOUSE"
  sql: "select 1"
  kinds: ["sql"]
  pool: "db_queue"
  group_name: "nightly_sales_load"
  description: "Merge staged sales into the fact table. [RunMyJobs source: chain:NIGHTLY_SALES_LOAD/step:load/call:sales_fact; produces dw.fact_sales]"
