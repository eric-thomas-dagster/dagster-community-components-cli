type: rmj_sample.components.RmjShellCommandAssetComponent
attributes:
  asset_name: "nightly_sales_load__sales"
  command: "echo extracting sales for today"
  env_vars: {"RMJ_PARAM_RUN_DATE": "today"}
  pool: "batch_queue"
  kinds: ["shell"]
  retry_policy_max_retries: 2
  retry_policy_delay_seconds: 60
  retry_policy_backoff: "linear"
  group_name: "nightly_sales_load"
  description: "Pull the previous day's sales files from the landing share. [RunMyJobs source: chain:NIGHTLY_SALES_LOAD/step:extract/call:sales; produces landing.sales_raw]"
  asset_tags: {"runmyjobs_source": "chain.NIGHTLY_SALES_LOAD.step.extract.call.sales", "runmyjobs_application": "SALES"}
---
