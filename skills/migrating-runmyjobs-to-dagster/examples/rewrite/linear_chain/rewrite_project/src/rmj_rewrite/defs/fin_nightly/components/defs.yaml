type: dagster_community_components.ShellCommandAssetComponent
attributes:
  asset_name: fin_pull
  command: "echo pull ${run_date}"
  env_vars: {run_date: "today"}
  success_exit_codes: [3]
  timeout_seconds: 600
  pool: batch_queue
  retry_policy_max_retries: 1
  run_window: "22:00-23:59 America/New_York mon,tue"
  group_name: fin_nightly
---
type: dagster_community_components.SqlAssetComponent
attributes:
  asset_key: fin_publish
  connection_env: RMJ_CONN_WAREHOUSE
  sql: "select 1"
  deps: [fin_transform]
  timeout_seconds: 300
  pool: batch_queue
  retry_policy_max_retries: 1
  run_window: "22:00-23:59 America/New_York mon,tue"
  group_name: fin_nightly
---
type: dagster_community_components.CronScheduleComponent
attributes:
  schedule_name: fin_sched
  cron_expression: "30 22 * * *"
  asset_keys: [fin_pull, fin_transform, fin_publish]
  job_name: fin_nightly
  execution_timezone: America/New_York
  default_status: STOPPED
---
type: dagster_community_components.FilesystemMonitorSensorComponent
attributes:
  sensor_name: fin_file_arrived
  directory_path: /data/inbound/fin
  file_pattern: "^fin_.*\\.csv$"
  job_name: fin_nightly
  minimum_interval_seconds: 60
  default_status: stopped
  min_age_seconds: 120
  min_size_bytes: 1
  require_stable_size: true
